name: Local AI release notes
description: Create or update a GitHub Release from Git history using a local Ollama model
author: TakuKobayashi

inputs:
  github-token:
    description: GitHub token with contents:write and models:read permissions
    required: true
  tag:
    description: Release tag. Defaults to the tag that triggered the workflow
    required: false
    default: ${{ github.ref_name }}
  model:
    description: Ollama model used to understand source-code changes
    required: false
    default: qwen2.5-coder:7b-instruct
  ollama-host:
    description: Ollama API base URL
    required: false
    default: http://127.0.0.1:11434
  language:
    description: Primary language used for release notes
    required: false
    default: en
  bilingual:
    description: Also include an English version when the selected language is not English
    required: false
    default: 'false'
  max-diff-chars:
    description: Maximum number of text-diff characters included in the Ollama request
    required: false
    default: '30000'
  num-ctx:
    description: Ollama context-window size
    required: false
    default: '16384'
  inference-timeout-seconds:
    description: Stop after this many seconds without an Ollama response
    required: false
    default: '600'
  fail-on-llm-error:
    description: Fail instead of publishing deterministic fallback notes when Ollama inference fails
    required: false
    default: 'false'
  dry-run:
    description: Generate and print notes without creating or updating a GitHub Release
    required: false
    default: 'false'
  output-file:
    description: Optional path where generated Markdown is written (especially useful with dry-run)
    required: false
    default: ''

outputs:
  release-url:
    description: URL of the created or updated GitHub Release
    value: ${{ steps.release.outputs.release-url }}
  previous-tag:
    description: Previous semantic-version tag used as the comparison base
    value: ${{ steps.release.outputs.previous-tag }}
  used-llm:
    description: Whether the release body was generated by the configured model
    value: ${{ steps.release.outputs.used-llm }}

runs:
  using: composite
  steps:
    - name: Install Ollama when needed
      continue-on-error: ${{ inputs.fail-on-llm-error != 'true' }}
      shell: bash
      env:
        OLLAMA_HOST_URL: ${{ inputs.ollama-host }}
      run: |
        if curl --silent --fail "$OLLAMA_HOST_URL/api/tags" >/dev/null; then
          exit 0
        fi
        case "$OLLAMA_HOST_URL" in
          http://127.0.0.1:*|http://localhost:*) ;;
          *) echo "Ollama is not reachable at $OLLAMA_HOST_URL" >&2; exit 1 ;;
        esac
        if ! command -v ollama >/dev/null 2>&1; then
          curl -fsSL https://ollama.com/install.sh | sh
        fi
        nohup ollama serve > "$RUNNER_TEMP/ai-release-notes-ollama.log" 2>&1 &
        for attempt in $(seq 1 60); do
          curl --silent --fail "$OLLAMA_HOST_URL/api/tags" >/dev/null && exit 0
          sleep 2
        done
        echo "Ollama did not become ready" >&2
        exit 1

    - name: Pull release-notes model
      continue-on-error: ${{ inputs.fail-on-llm-error != 'true' }}
      shell: bash
      env:
        OLLAMA_HOST_URL: ${{ inputs.ollama-host }}
        OLLAMA_MODEL: ${{ inputs.model }}
      run: |
        payload=$(node -e 'process.stdout.write(JSON.stringify({model: process.env.OLLAMA_MODEL}))')
        curl --fail --show-error --silent \
          "$OLLAMA_HOST_URL/api/pull" \
          --header "Content-Type: application/json" \
          --data "$payload" >/dev/null

    - name: Generate notes and publish GitHub Release
      id: release
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OLLAMA_HOST: ${{ inputs.ollama-host }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_BILINGUAL: ${{ inputs.bilingual }}
        INPUT_MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        INPUT_NUM_CTX: ${{ inputs.num-ctx }}
        INPUT_INFERENCE_TIMEOUT_SECONDS: ${{ inputs.inference-timeout-seconds }}
        INPUT_FAIL_ON_LLM_ERROR: ${{ inputs.fail-on-llm-error }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
      run: node "$GITHUB_ACTION_PATH/generate-release-notes.mjs"

branding:
  icon: file-text
  color: blue
